name: opencode-${PROJECT_SLUG:-default}

# Overlay: the opt-in autonomous orchestrator.
#
# Bring it up with ./scripts/symphony, not raw compose: symphony's settings live
# in symphony/.env (kept out of the root .env, which docker-compose.yml hands to
# the agent's container wholesale), and the launcher is what puts both files in
# front of compose:
#
#   docker compose --env-file .env --env-file symphony/.env \
#                  -f docker-compose.yml -f docker-compose.symphony.yml up -d
#
# Nothing in the base stack changes when this file is absent, which is the
# point: symphony is a different way of working, not a new default. Read
# docs/SYMPHONY.md before the first run — in particular the part about scoping
# the GitLab token, which is the containment that actually holds.

services:
  symphony:
    image: ${IMAGE_REGISTRY:-opencode-workplace}-symphony:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: symphony/Dockerfile
      args:
        # Defaults are a PIN, not a floating branch — an image built from `main`
        # is not reproducible. Override SYMPHONY_REF in symphony/.env to move.
        SYMPHONY_REF: ${SYMPHONY_REF:-v0.4.0}
        # A constant unless you fork; overridable, but not worth a line in the
        # example file.
        SYMPHONY_REPO: ${SYMPHONY_REPO:-https://github.com/Haugenau20/symphony-queue.git}
    container_name: opencode-symphony-${PROJECT_SLUG:-default}
    hostname: symphony
    depends_on:
      - opencode
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      SYMPHONY_QUEUE_ROOT: /queue
      SYMPHONY_WORKSPACES_ROOT: /workspaces
      SYMPHONY_WORKFLOW: /config/WORKFLOW.md
      # Follows the opencode container's INTERNAL port, not OPENCODE_PORT: this
      # is a container-to-container URL on an internal network, so the host
      # publication is irrelevant to it. Keep opencode.server_url in
      # WORKFLOW.md pointing at the same place — that is what the orchestrator
      # actually dials; this one drives the entrypoint's readiness wait.
      SYMPHONY_OPENCODE_URL: http://opencode:${OPENCODE_INTERNAL_PORT:-4096}
      SYMPHONY_LOG_LEVEL: ${SYMPHONY_LOG_LEVEL:-info}
      # Only set for tracker.kind: gitlab. Leave blank for the file queue and
      # this container keeps its stronger posture: no credentials at all.
      #
      # This MUST be a PROJECT access token with the REPORTER role — it can
      # read and write issues on one project and cannot push code. The agent's
      # Developer token lives in the opencode container and never comes here.
      # Neither can do the other's job. docs/SYMPHONY.md §two tokens.
      SYMPHONY_GITLAB_TOKEN: ${SYMPHONY_GITLAB_TOKEN:-}
      # Egress for the GitLab tracker only, and not a value you set by hand:
      # ./scripts/symphony derives it from tracker.kind in WORKFLOW.md. With
      # tracker.kind: file_queue it stays empty and the container has no route
      # off-host at all.
      HTTP_PROXY: ${SYMPHONY_HTTP_PROXY:-}
      HTTPS_PROXY: ${SYMPHONY_HTTP_PROXY:-}
      http_proxy: ${SYMPHONY_HTTP_PROXY:-}
      https_proxy: ${SYMPHONY_HTTP_PROXY:-}
      NO_PROXY: "localhost,127.0.0.1,::1,opencode,squid"
      no_proxy: "localhost,127.0.0.1,::1,opencode,squid"
    volumes:
      # The queue. Bind-mounted from the host so `ls`, `mv` and your editor are
      # the management UI. All six state directories live under this one root:
      # the claim is a rename(2) between them, which is only atomic within a
      # single filesystem.
      - ${SYMPHONY_QUEUE_PATH:-./symphony-queue}:/queue:z
      # Per-item agent workspaces. NOT your repo at ${REPO_PATH} — symphony
      # clones fresh per item and must never be pointed at working state you
      # care about.
      - ${SYMPHONY_WORKSPACES_PATH:-./symphony-workspaces}:/workspaces:z
      # WORKFLOW.md — the per-project prompt + config. Read-only: it is trusted
      # input (it drives hooks), and the agent must never be able to edit it.
      - ${SYMPHONY_CONFIG_PATH:-./symphony}:/config:ro,z
    networks:
      # oc_internal reaches opencode. oc_proxy is only useful once
      # SYMPHONY_HTTP_PROXY points at squid, which you set for the gitlab
      # tracker; on the file queue symphony has no egress regardless, because
      # both networks are internal: true and squid is the only way out.
      - oc_internal
      - oc_proxy
    restart: unless-stopped

  # The agent's workspaces have to be visible to the container that actually
  # runs the agent, at the same path symphony hands it in the prompt.
  opencode:
    volumes:
      - ${SYMPHONY_WORKSPACES_PATH:-./symphony-workspaces}:/workspaces:z
    environment:
      # Symphony's per-item workspaces sit OUTSIDE the /workspace project root,
      # and opencode gates any tool touching an external path behind
      # `permission.external_directory`, which defaults to "ask". Unattended
      # means nobody is there to answer, so without this the very first file
      # operation of every run blocks forever.
      #
      # This is the same generic hook the launcher uses for its --also mounts;
      # here the overlay plays the launcher's role. Only this glob is allowed —
      # everything else still hits the "ask" default.
      OPENCODE_EXTRA_ALLOWED_DIRS: /workspaces/**
      # Symphony runs unattended, so remote git must be on. That makes the
      # destination allowlist the thing standing between a confused agent and
      # your production repos — but only as defence in depth. The boundary is
      # the token: see docs/SYMPHONY.md.
      ALLOW_REMOTE_GIT: ${ALLOW_REMOTE_GIT:-0}
      GIT_REMOTE_ALLOWLIST: ${GIT_REMOTE_ALLOWLIST:-}
