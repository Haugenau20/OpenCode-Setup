name: opencode-${PROJECT_SLUG:-default}

services:
  opencode:
    image: ${IMAGE_REGISTRY:-opencode-workplace}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: opencode/Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.17.15}
    container_name: opencode-${PROJECT_SLUG:-default}
    hostname: opencode
    depends_on:
      - squid
    env_file:
      # Two layers, last wins. The root .env holds what every project shares
      # (LLM endpoint, image tag, git identity); the per-project file holds what
      # differs — above all the SCOPED credentials, since a project access token
      # is the containment boundary and by definition cannot be shared.
      #
      # PROJECT_ENV_FILE is set by the launchers from `-p <slug>`; unset it
      # defaults to .env, which is then read twice and changes nothing. That is
      # the single-project case, unchanged.
      #
      # A per-project value may also BLANK an inherited one (`CONFLUENCE_PAT=`),
      # which is how a symphony project keeps the "credential absence removes
      # capability" property from docs/SYMPHONY.md §2 without the root .env
      # having to be empty for everyone else.
      #
      # Note what is deliberately NOT here: symphony/.env and its per-project
      # counterpart. This directive is the agent's environment, and symphony's
      # tracker token has no business in it.
      - .env
      - path: ${PROJECT_ENV_FILE:-.env}
        required: false
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      # NO_PROXY is also set in policy.yaml; this is the docker-side copy so
      # in-container DNS for sidecars (rag, squid, opencode itself) bypasses
      # the proxy. Deliberately NO `.local` here: a corp service addressed by a
      # *.local FQDN (e.g. bitbucket.corp.local) would otherwise match and be
      # routed DIRECTLY instead of through squid — breaking git/curl to it. See
      # policy.yaml for the full rationale.
      NO_PROXY: "localhost,127.0.0.1,::1,opencode,squid,rag"
      no_proxy: "localhost,127.0.0.1,::1,opencode,squid,rag"
      # The in-container listen port. Everything that must agree on it — the
      # oc-publish socat forwarder below, the symphony overlay's
      # SYMPHONY_OPENCODE_URL — reads the same variable, so there is one place
      # to change it. NOT OPENCODE_PORT: that is the HOST port, and the two are
      # decoupled precisely so several stacks can differ on the host while all
      # of them stay on 4096 inside.
      OPENCODE_INTERNAL_PORT: "${OPENCODE_INTERNAL_PORT:-4096}"
      # opencode-pty viewer: force the plugin to bind non-loopback (so oc-publish
      # can reach it) and to a fixed, per-instance port DERIVED from OPENCODE_PORT
      # by prepending a '1' (main 4096 -> viewer 14096). This keeps the viewer far
      # from the 4096+N block a multi-instance launcher hands out for main ports,
      # and makes it unique per instance for free — so the plugin never falls back
      # to a random port oc-publish couldn't forward, and two stacks never collide
      # on the viewer's host port. (Assumes OPENCODE_PORT stays 4 digits.)
      PTY_WEB_HOSTNAME: "0.0.0.0"
      PTY_WEB_PORT: "1${OPENCODE_PORT:-4096}"
    volumes:
      # :z relabels the bind-mounted repo for SELinux (shared label). Without it,
      # an enforcing host denies the container access to /workspace. Named volumes
      # below are auto-labelled by Docker and need no flag.
      - ${REPO_PATH:-./repo}:/workspace:z
      - oc_state:/home/dev/.local/share/opencode
      - oc_cfg:/home/dev/.config/opencode
    networks:
      - oc_internal
      - oc_proxy
    # The container needs enough caps to chown bind mounts and (optionally)
    # mount tmpfs for session-logs-off mode. No --privileged.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    stdin_open: true
    tty: true

  # Publisher sidecar: opencode runs on internal-only networks (no egress), so
  # modern Docker won't bind its published port on the host. This minimal socat
  # forwarder lives on a normal (non-internal) bridge — so ITS ports can be
  # published — plus oc_proxy, so it can reach opencode. It runs two socat
  # listeners: ${OPENCODE_INTERNAL_PORT} -> opencode:${OPENCODE_INTERNAL_PORT}
  # (the OpenCode server) and
  # 1${OPENCODE_PORT} -> opencode:1${OPENCODE_PORT} (e.g. 14096, the opencode-pty
  # web viewer, only live when that plugin is enabled and its server is started
  # via /pty-open-background-spy). It is not an open proxy and grants opencode no
  # egress.
  oc-publish:
    image: ${IMAGE_REGISTRY:-opencode-workplace}-squid:${IMAGE_TAG:-local}
    container_name: opencode-publish-${PROJECT_SLUG:-default}
    hostname: oc-publish
    depends_on:
      - opencode
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'kill 0' TERM INT
        socat TCP-LISTEN:${OPENCODE_INTERNAL_PORT:-4096},fork,reuseaddr TCP:opencode:${OPENCODE_INTERNAL_PORT:-4096} &
        socat TCP-LISTEN:1${OPENCODE_PORT:-4096},fork,reuseaddr TCP:opencode:1${OPENCODE_PORT:-4096} &
        wait
    ports:
      # host:container — OPENCODE_PORT is the host side (change it per stack),
      # OPENCODE_INTERNAL_PORT the container side (leave it alone).
      - "127.0.0.1:${OPENCODE_PORT:-4096}:${OPENCODE_INTERNAL_PORT:-4096}"
      - "127.0.0.1:1${OPENCODE_PORT:-4096}:1${OPENCODE_PORT:-4096}"
    networks:
      - oc_proxy
      - oc_publish
    restart: unless-stopped

  squid:
    image: ${IMAGE_REGISTRY:-opencode-workplace}-squid:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: squid/Dockerfile
    container_name: opencode-squid-${PROJECT_SLUG:-default}
    hostname: squid
    volumes:
      # Per-developer allowlist additions. Drop *.conf files into
      # ./extra-allowlist.d/ on the host (gitignored) and restart squid.
      #
      # Per-project override: point EXTRA_ALLOWLIST_PATH at the project's own
      # directory to give one stack a different egress surface. That is what
      # docs/SYMPHONY.md §3 asks for — a symphony stack needs the LLM endpoint
      # and GitLab and nothing else — and it was not expressible while every
      # stack shared one directory.
      #
      # ro,z = read-only + shared SELinux relabel (z, not Z: the default dir is
      # mounted into every project's squid, so it must share one label).
      - ${EXTRA_ALLOWLIST_PATH:-./extra-allowlist.d}:/etc/squid/extra-allowlist.d:ro,z
    networks:
      - oc_proxy
      - oc_egress

networks:
  oc_internal:
    driver: bridge
    internal: true
  oc_proxy:
    driver: bridge
    internal: true
  oc_egress:
    driver: bridge
  oc_publish:
    driver: bridge

volumes:
  oc_state:
    name: opencode-${PROJECT_SLUG:-default}_state
  oc_cfg:
    name: opencode-${PROJECT_SLUG:-default}_cfg
