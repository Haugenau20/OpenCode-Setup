# Workplace squid: deny-by-default outbound proxy. Allowlist is composed of
# files under /etc/squid/allowlist.d/*.conf which are included below.

# ---- Listener ---------------------------------------------------------------
http_port 3128

# Don't advertise version.
httpd_suppress_version_string on
visible_hostname opencode-squid

# ---- ACL: localnet (the docker proxy net) -----------------------------------
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

# SSL_ports = ports squid will allow CONNECT (TLS tunnel) to. Anything not
# listed here is refused by `http_access deny CONNECT !SSL_ports` below — so a
# git-over-HTTPS endpoint on a non-443 port (e.g. Bitbucket on 7990) MUST be
# listed here or clones/pushes fail with a denied CONNECT.
acl SSL_ports port 443
acl SSL_ports port 7990         # bitbucket git over HTTPS (CONNECT tunnel)
acl SSL_ports port 8443         # alt-HTTPS, if your services use it
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl Safe_ports port 7990        # bitbucket server (https)
acl Safe_ports port 8443        # alt https
acl CONNECT method CONNECT

# ---- Allowlist --------------------------------------------------------------
# Each *.conf in allowlist.d/ defines `acl allowed_dst dstdomain ...` lines.
# Devs can add their own entries to extra-allowlist.conf (gitignored).
include /etc/squid/allowlist.d/*.conf

# Optional per-developer extras, mounted in from the host as a directory.
# squid aborts at startup if this glob matches no files, so the directory ships
# with a committed placeholder.conf (comment-only) to guarantee a match. Devs
# drop their own *.conf files alongside it (gitignored).
include /etc/squid/extra-allowlist.d/*.conf

# ---- Rules ------------------------------------------------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow localnet allowed_dst
http_access allow localhost
http_access deny all

# ---- Caching ----------------------------------------------------------------
# Disable disk cache — LLM responses are non-cacheable and we don't want to
# accidentally retain conversation data on the squid host.
cache deny all
access_log none
