# ─────────────────────────────────────────────────────────────────────────────
# Do NOT rename the ACL `allowed_dst`. Squid MERGES every `acl allowed_dst
# dstdomain ...` line across all files in this directory into one ACL set, and
# the single rule `http_access allow localnet allowed_dst` in squid.conf grants
# egress to that set. Renaming it here (e.g. allowed_dst_jfrog) makes squid drop
# everything except the last-named ACL. Only edit the DOMAIN after `dstdomain`.
#
# Squid warnings like "is a subdomain of" or "Ignoring duplicate domain" refer
# to overlapping DOMAIN values (e.g. several hosts under one parent domain), not
# the repeated ACL name — they are non-fatal. If all your hosts share one
# internal parent domain you may collapse them into a single entry.
#
# This directory is for `dstdomain` entries ONLY. Do NOT add `acl allowed_dst
# port ...` (or any other ACL type) here — reusing the name with a different
# type is FATAL ("ACL 'allowed_dst' already exists with different type"). To
# allow a non-standard TLS port, add it to SSL_ports in squid.conf instead.
# ─────────────────────────────────────────────────────────────────────────────

# JFrog Artifactory. The REST API is served over standard HTTPS (443) — already
# in SSL_ports, so no squid.conf change is needed for the default setup. JFrog
# is API-only here (no git transport), unlike Bitbucket/GitLab.
#
# NOTE: if your Artifactory listens on a non-standard port, add that port to
# SSL_ports in squid.conf (same as the Bitbucket 7990 note); port 443 needs no
# change. Add the hostname below; do NOT add the port here. If your image
# registry (IMAGE_REGISTRY in .env) is the SAME host, this one entry covers it.
acl allowed_dst dstdomain .jfrog.internal.example
