# TeamCity instances. These are the ten approved bare DNS names. Squid's
# append_domain setting resolves dotless names; dstdomain matching happens
# before DNS, so the bare names themselves must be allowlisted here.
#
# If deployment uses FQDNs in TEAMCITY<n>_BASE_URL, replace or extend these
# entries with those exact hostnames. Hostnames only: TeamCity's default 8111
# port belongs in Safe_ports and SSL_ports in squid.conf, not here.
acl allowed_dst dstdomain teamcity1
acl allowed_dst dstdomain teamcity2
acl allowed_dst dstdomain teamcity3
acl allowed_dst dstdomain teamcity4
acl allowed_dst dstdomain teamcity5
acl allowed_dst dstdomain teamcity6
acl allowed_dst dstdomain teamcity7
acl allowed_dst dstdomain teamcity8
acl allowed_dst dstdomain teamcity9
acl allowed_dst dstdomain teamcity10
