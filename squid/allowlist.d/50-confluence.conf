# ─────────────────────────────────────────────────────────────────────────────
# Do NOT rename the ACL `allowed_dst`. Squid MERGES every `acl allowed_dst
# dstdomain ...` line across all files in this directory into one ACL set, and
# the single rule `http_access allow localnet allowed_dst` in squid.conf grants
# egress to that set. Renaming it here (e.g. allowed_dst_confluence) makes squid
# drop everything except the last-named ACL. Only edit the DOMAIN after
# `dstdomain`.
#
# Squid warnings like "is a subdomain of" or "Ignoring duplicate domain" refer
# to overlapping DOMAIN values (e.g. several hosts under one parent domain), not
# the repeated ACL name — they are non-fatal. If all your hosts share one
# internal parent domain you may collapse them into a single entry.
#
# This directory is for `dstdomain` entries ONLY. Do NOT add `acl allowed_dst
# port ...` (or any other ACL type) here — reusing the name with a different
# type is FATAL ("ACL 'allowed_dst' already exists with different type"). The
# port (8090) is opened in SSL_ports/Safe_ports in squid.conf instead.
# ─────────────────────────────────────────────────────────────────────────────

# Confluence. API-only here (no git transport), like Jira/JFrog. Confluence's
# default connector is HTTP on port 8090, which is opened in BOTH Safe_ports
# (plain-HTTP GETs) and SSL_ports (in case your instance fronts it with HTTPS)
# in squid.conf. Add the hostname below; do NOT add the port here. If your
# Confluence is served over standard HTTPS (443), no squid.conf port change is
# needed — just set the hostname here and drop the :8090 from CONFLUENCE_BASE_URL.
acl allowed_dst dstdomain .confluence.internal.example
