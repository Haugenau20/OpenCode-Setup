# Workplace policy. Read-only inside the image. Developers cannot override
# these from their user layer — these are the things we want to be sure of.

env:
  # Disable opencode's own telemetry / autoupdate.
  OPENCODE_DISABLE_TELEMETRY: "1"
  OPENCODE_AUTOUPDATE: "0"

  # Plugins are baked with their deps vendored; never let OpenCode/Bun try to
  # install plugin dependencies at startup (the egress lock would block it and
  # stall/​noise the boot). Resolution falls back to the vendored node_modules.
  BUN_CONFIG_SKIP_INSTALL_PACKAGES: "true"

  # Common phone-home flags for tooling we ship.
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  npm_config_audit: "false"
  npm_config_fund: "false"

  # Force all egress through squid. NO_PROXY lists ONLY loopback + the docker
  # internal sidecar names (opencode, rag, squid) so their traffic isn't routed
  # through the proxy. Do NOT add `.local` (or any corp domain suffix) here: an
  # internal service addressed by a *.local FQDN — e.g. bitbucket.corp.local —
  # would then match NO_PROXY and be routed DIRECTLY, bypassing squid. The
  # container has no direct egress, so git/curl to that host fail ("could not
  # resolve host"); only the MCP survives, because undici's ProxyAgent ignores
  # NO_PROXY. Everything external must go through squid.
  NO_PROXY: "localhost,127.0.0.1,::1,opencode,rag,squid"
